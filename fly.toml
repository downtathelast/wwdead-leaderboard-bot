app = 'wwdead-leaderboard-bot'
primary_region = 'sjc'
[build]
[mounts]
  source = "leaderboard_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

kill_signal = "SIGINT"
kill_timeout = 5000

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024